<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>Dashboard — ColivSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="css/site.css">
  <script>
    if (localStorage.getItem('colivsync_theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="dashboard-page">
  <header class="dash-header">
    <a class="brand" href="index.html"><span class="brand-symbol">C</span><span>Coliv<span class="brand-accent">Sync</span></span></a>
    <div class="dash-header-right">
      <span class="dash-location" id="dashLocation"></span>
      <button class="icon-button" type="button" id="themeButton" aria-label="Toggle theme">◐</button>
      <div class="notification-wrap">
        <button class="icon-button notification-button" type="button" id="notificationButton" aria-label="Show notifications">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span id="notificationCount" hidden>0</span>
        </button>
        <div class="notification-panel" id="notificationPanel" hidden></div>
      </div>
      <div class="profile-menu"><span class="profile-avatar" id="profileAvatar">C</span><span id="profileName">Community member</span></div>
      <button class="button button-outline button-small" type="button" id="logoutButton">Sign out</button>
    </div>
  </header>
  <div class="dash-shell">
    <aside class="dash-sidebar">
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="dashNavigation" class="dash-navigation" aria-label="Dashboard sections"></nav>
      <div class="sidebar-spacer"></div>
      <a class="sidebar-home" href="index.html"><span>←</span> Back to ColivSync</a>
    </aside>
    <main id="dashboardContent" class="dash-content" aria-live="polite">
      <div class="dash-loading"><span></span> Loading your workspace…</div>
    </main>
  </div>
  <div id="dashToasts" class="toast-region" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
